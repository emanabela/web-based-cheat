<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cheat</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

  <!-- LOBBY SCREEN -->
  <div id="screen-lobby" class="screen active">
    <h1>Cheat</h1>
    <p class="subtitle">The card game of bluffing</p>

    <div class="card-box">
      <label for="input-name">Your name</label>
      <input id="input-name" type="text" placeholder="Enter your name" maxlength="16">

      <div class="divider"></div>

      <button id="btn-create">Create Room</button>

      <div class="divider-text">or</div>

      <label for="input-room">Room code</label>
      <input id="input-room" type="text" placeholder="Enter room code" maxlength="36">
      <button id="btn-join">Join Room</button>
    </div>
  </div>

  <!-- WAITING ROOM SCREEN -->
  <div id="screen-waiting" class="screen">
    <h1>Waiting Room</h1>
    <div class="card-box">
      <p>Share this code with other players:</p>
      <div id="room-code-display" class="room-code"></div>
      <button id="btn-copy">Copy Code</button>
      <div class="divider"></div>
      <p>Players (<span id="player-count">1</span>):</p>
      <ul id="player-list"></ul>
      <button id="btn-start" disabled>Start Game (need 2+)</button>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="screen-game" class="screen">
    <div id="game-header">
      <div id="turn-info">
        <span id="current-player-label">—</span>'s turn
      </div>
      <div id="rank-info">Play: <strong id="current-rank-label">—</strong></div>
      <div id="pile-info">Pile: <strong id="pile-count">0</strong> cards</div>
    </div>

    <div id="game-log-wrap">
      <div id="game-log"></div>
    </div>

    <div id="action-area">
      <button id="btn-cheat" class="btn-danger">Call Cheat!</button>
    </div>

    <div id="hand-area">
      <p id="hand-label">Your hand (<span id="hand-count">0</span> cards):</p>
      <div id="hand-cards"></div>
      <div id="play-controls">
        <button id="btn-play" disabled>Play Selected</button>
        <span id="selected-info">Select cards to play</span>
      </div>
    </div>
  </div>

  <!-- END SCREEN -->
  <div id="screen-end" class="screen">
    <div class="card-box center">
      <h1 id="end-title">Game Over</h1>
      <p id="end-message"></p>
      <button id="btn-restart">Back to Lobby</button>
    </div>
  </div>

  <div id="toast"></div>

  <script src="game.js"></script>
</body>
</html>
